  <style>
    /* ===========================================================
       Portfolio v2 — only this page changes. All classes are
       prefixed `pv-` so nothing leaks into the shared stylesheet.
       =========================================================== */
    :root {
      --pv-paper: #fff4dc;
      --pv-dim: rgba(255, 238, 210, 0.72);
      --pv-gold: #f8cf84;
      --pv-gold-hi: #ffe7b0;
      --pv-rose: #ff9d8f;
      --pv-ink: #1b0d08;
      --pv-card: rgba(26, 11, 6, 0.64);
      --pv-card-hi: rgba(44, 19, 10, 0.8);
      --pv-line: rgba(248, 207, 132, 0.22);
      --pv-line-hi: rgba(255, 223, 160, 0.72);
      --pv-r: 16px;
      --pv-serif: "Cormorant Garamond", "Noto Serif SC", Georgia, serif;
      --pv-sans: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --pv-spring: cubic-bezier(.2, 1.4, .35, 1);
      --pv-ease: cubic-bezier(.16, 1, .3, 1);
    }
    body.pv-page { -webkit-tap-highlight-color: transparent; }
    body.pv-page.pv-locked { overflow: hidden; }

    .pv-shell {
      width: min(100% - 2 * clamp(16px, 4vw, 48px), 1240px);
      margin: 0 auto; padding: clamp(96px, 14vw, 140px) 0 48px;
      color: var(--pv-paper); font-family: var(--pv-sans);
    }

    /* ---------- Intro (short — the work is the hero) ---------- */
    .pv-intro { display: grid; gap: 22px; margin-bottom: clamp(32px, 5vw, 56px); text-align: left; }
    @media (min-width: 1024px) { .pv-intro { grid-template-columns: minmax(0, .9fr) minmax(0, 1.2fr); align-items: center; gap: 48px; } }
    .pv-eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .2em; color: var(--pv-gold); text-transform: uppercase; }
    .pv-title { margin: 8px 0 0; font: 700 clamp(34px, 5.2vw, 58px)/1 var(--pv-serif); text-shadow: 0 0 28px rgba(226, 176, 94, .24); }
    .pv-copy { max-width: 560px; margin: 14px 0 0; font-size: clamp(14px, 1.6vw, 16px); line-height: 1.75; color: var(--pv-dim); }
    .pv-stats { display: flex; gap: 22px; margin-top: 20px; }
    .pv-stats b { display: block; font: 700 32px/1 var(--pv-serif); color: var(--pv-gold-hi); }
    .pv-stats span { font-size: 12px; color: var(--pv-dim); }

    /* ---------- Feedback layer: every interaction answers back ---------- */
    .pv-fx { transition: transform 280ms var(--pv-spring), filter 200ms ease; }
    .pv-fx.is-pressed { transform: scale(.955); transition-duration: 90ms; filter: brightness(1.12); }
    .pv-ring {
      position: fixed; z-index: 120; left: 0; top: 0; pointer-events: none;
      width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
      border: 2px solid var(--pv-gold-hi); box-shadow: 0 0 12px rgba(255, 200, 110, .7);
      animation: pvRing 520ms var(--pv-ease) forwards;
    }
    @keyframes pvRing { to { transform: scale(var(--sz, 7)); opacity: 0; } }
    .pv-spark {
      position: fixed; z-index: 120; left: 0; top: 0; pointer-events: none;
      width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
      background: var(--pv-gold-hi); box-shadow: 0 0 8px var(--pv-gold);
      animation: pvSpark 560ms var(--pv-ease) forwards;
    }
    @keyframes pvSpark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }

    /* ---------- Video media (real <video> or animated placeholder) ---------- */
    .pv-media { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; background: #140705; isolation: isolate; }
    .pv-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .pv-ph { position: absolute; inset: 0; overflow: hidden; background: var(--ph-bg, linear-gradient(135deg, #3a1410, #12060a)); }
    .pv-ph::before {
      content: ""; position: absolute; inset: -40%;
      background:
        radial-gradient(circle at 30% 40%, var(--ph-a, rgba(255, 170, 110, .55)), transparent 34%),
        radial-gradient(circle at 70% 60%, var(--ph-b, rgba(255, 120, 130, .4)), transparent 36%),
        radial-gradient(circle at 50% 80%, rgba(255, 230, 170, .22), transparent 30%);
      animation: pvDrift 7s ease-in-out infinite alternate;
    }
    .pv-ph::after {
      content: attr(data-label); position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      padding: 6px 12px; border: 1px dashed rgba(255, 230, 180, .45); border-radius: 8px;
      font-size: 11px; font-weight: 800; letter-spacing: .12em; color: rgba(255, 238, 205, .82); white-space: nowrap;
    }
    .is-paused .pv-ph::before { animation-play-state: paused; }
    @keyframes pvDrift { from { transform: translate(-6%, -4%) rotate(0) scale(1); } to { transform: translate(6%, 4%) rotate(12deg) scale(1.12); } }
    .pv-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; z-index: 2; background: rgba(255, 255, 255, .12); }
    .pv-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--pv-gold), var(--pv-rose)); box-shadow: 0 0 8px var(--pv-gold); }
    .pv-badge {
      position: absolute; left: 10px; top: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 9px; border-radius: 999px; background: rgba(0, 0, 0, .55); backdrop-filter: blur(6px);
      font-size: 11px; font-weight: 800; letter-spacing: .05em; color: var(--pv-paper);
    }
    .pv-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #ff6b6b; box-shadow: 0 0 6px #ff6b6b; }
    .is-paused .pv-badge::before { background: #999; box-shadow: none; }

    /* ---------- Featured showreel ---------- */
    .pv-reel {
      display: block; width: 100%; padding: 8px; text-align: left; cursor: pointer; color: inherit; font: inherit;
      border-radius: calc(var(--pv-r) + 4px); background: var(--pv-card); border: 1px solid var(--pv-line);
      box-shadow: 0 30px 70px rgba(0, 0, 0, .45);
    }
    .pv-reel .pv-media { border-radius: var(--pv-r); }
    .pv-reel__cap { display: flex; justify-content: space-between; gap: 10px; padding: 10px 6px 4px; font-size: 13px; color: var(--pv-dim); }
    .pv-reel__cap b { color: var(--pv-paper); }
    @media (hover: hover) { .pv-reel:hover { border-color: var(--pv-line-hi); } }

    /* ---------- Section head + filters ---------- */
    .pv-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; margin: 8px 0 18px; }
    .pv-head h2 { margin: 0; font: 700 clamp(32px, 6vw, 48px)/1 var(--pv-serif); color: var(--pv-paper); }
    .pv-head h2 sup { margin-left: 6px; font: 800 13px/1 var(--pv-sans); color: var(--pv-gold); vertical-align: top; }
    .pv-filters { display: flex; gap: 6px; max-width: 100%; overflow-x: auto; scrollbar-width: none; padding: 2px; }
    .pv-filters::-webkit-scrollbar { display: none; }
    .pv-chip {
      flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--pv-line); background: rgba(24, 10, 6, .55); color: var(--pv-dim);
      font: 700 13px/1 var(--pv-sans);
      transition: background 200ms, color 200ms, transform 280ms var(--pv-spring);
    }
    .pv-chip.is-on { background: var(--pv-gold); color: var(--pv-ink); border-color: transparent; box-shadow: 0 0 16px rgba(255, 190, 110, .35); }
    .pv-chip small { margin-left: 5px; font-size: 11px; opacity: .6; }

    /* ---------- Works heading + filters (original form, larger) ---------- */
    .pv-wh {
      display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 18px;
      margin: 0 0 22px; color: var(--pv-gold);
    }
    .pv-wh::before { content: "✿"; font-size: 1.3rem; color: rgba(226, 176, 94, .7); }
    .pv-wh::after { content: ""; height: 1px; background: linear-gradient(90deg, rgba(226, 176, 94, .6), transparent); }
    .pv-wh span {
      font: 700 clamp(30px, 4.4vw, 48px)/1 var(--pv-serif); letter-spacing: .22em;
      text-shadow: 0 0 22px rgba(226, 176, 94, .3);
    }
    .pv-filters { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 30px; }
    .pv-fbtn {
      min-width: 104px; min-height: 48px; padding: 0 22px; cursor: pointer;
      border: 1px solid rgba(226, 176, 94, .45); border-radius: 0; background: rgba(21, 11, 8, .55);
      color: rgba(245, 213, 157, .78); font: 700 15px/1 var(--pv-sans); letter-spacing: .12em; text-transform: uppercase;
      transition: color 180ms, border-color 180ms, background 180ms, box-shadow 180ms, transform 280ms var(--pv-spring);
    }
    @media (hover: hover) { .pv-fbtn:hover { color: var(--pv-paper); border-color: rgba(255, 223, 160, .8); background: rgba(72, 35, 15, .56); } }
    .pv-fbtn.is-on {
      color: var(--pv-paper); border-color: var(--pv-gold); background: rgba(90, 42, 16, .7);
      box-shadow: 0 0 20px rgba(226, 176, 94, .25), inset 0 0 0 1px rgba(255, 223, 160, .35);
    }
    @media (max-width: 640px) {
      .pv-filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; gap: 8px; margin-right: calc(-1 * clamp(16px, 4vw, 48px)); padding-right: 16px; }
      .pv-filters::-webkit-scrollbar { display: none; }
      .pv-fbtn { flex: none; min-width: 0; min-height: 44px; padding: 0 16px; font-size: 14px; }
    }

    /* ---------- Grid: phone 1 / iPad portrait 2 / iPad landscape+ 3 ---------- */
    .pv-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .pv-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; } }
    @media (min-width: 1080px) { .pv-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; } }

    .pv-card {
      position: relative; display: flex; flex-direction: column; width: 100%; padding: 8px; cursor: pointer;
      text-align: left; color: var(--pv-paper); font: inherit;
      border-radius: calc(var(--pv-r) + 4px); background: var(--pv-card); border: 1px solid var(--pv-line);
      transition: transform 320ms var(--pv-spring), border-color 220ms, background 220ms, box-shadow 320ms, opacity 280ms;
    }
    .pv-card .pv-media { border-radius: var(--pv-r); }
    .pv-card__body { padding: 12px 8px 8px; }
    .pv-kicker { font-size: 11px; font-weight: 800; letter-spacing: .14em; color: var(--pv-gold); }
    .pv-card__title { margin: 4px 0 0; font: 700 24px/1.1 var(--pv-serif); transition: color 200ms; }
    .pv-card__meta { margin-top: 6px; font-size: 13px; color: var(--pv-dim); }
    .pv-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .pv-tag { padding: 3px 8px; border-radius: 6px; background: rgba(255, 230, 180, .08); border: 1px solid var(--pv-line); font-size: 11px; font-weight: 700; color: var(--pv-paper); }
    /* pointer spotlight */
    .pv-card::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
      background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 210, 140, .14), transparent 60%);
      transition: opacity 250ms;
    }
    /* outline that closes in on hover */
    .pv-card::after {
      content: ""; position: absolute; inset: -10px; border-radius: calc(var(--pv-r) + 12px); pointer-events: none;
      border: 1.5px solid var(--pv-line-hi); opacity: 0; transform: scale(1.04);
      transition: opacity 240ms, transform 380ms var(--pv-ease), inset 380ms var(--pv-ease);
    }
    @media (hover: hover) {
      .pv-card:hover { transform: translateY(-6px); border-color: var(--pv-line-hi); background: var(--pv-card-hi); box-shadow: 0 24px 50px rgba(0, 0, 0, .45), 0 0 30px rgba(255, 190, 110, .12); }
      .pv-card:hover::before { opacity: 1; }
      .pv-card:hover::after { opacity: 1; transform: scale(1); inset: -4px; }
      .pv-card:hover .pv-card__title { color: var(--pv-gold-hi); }
    }
    .pv-card.is-pressed { transform: scale(.97); }
    .pv-card.is-out { opacity: 0; transform: scale(.94) translateY(10px); pointer-events: none; }
    .pv-card.is-hidden { display: none; }
    .pv-rise { opacity: 0; transform: translateY(18px); transition: opacity 650ms ease, transform 750ms var(--pv-ease); transition-delay: var(--d, 0ms); }
    .pv-rise.is-in { opacity: 1; transform: none; }

    /* ---------- Lightbox ---------- */
    .pv-lb { position: fixed; inset: 0; z-index: 110; display: grid; place-items: center; padding: 12px; visibility: hidden; font-family: var(--pv-sans); color: var(--pv-paper); }
    .pv-lb.is-open { visibility: visible; }
    .pv-lb__scrim { position: absolute; inset: 0; background: rgba(5, 2, 1, .78); backdrop-filter: blur(8px); opacity: 0; transition: opacity 300ms; }
    .pv-lb.is-open .pv-lb__scrim { opacity: 1; }
    .pv-lb__panel {
      position: relative; width: min(960px, 100%); max-height: calc(100dvh - 24px); overflow: auto;
      border-radius: 20px; background: rgba(24, 10, 6, .97); border: 1px solid var(--pv-line-hi);
      box-shadow: 0 40px 100px rgba(0, 0, 0, .7); transform-origin: var(--ox, 50%) 30%;
      opacity: 0; transform: scale(.88); transition: transform 420ms var(--pv-spring), opacity 220ms;
    }
    .pv-lb.is-open .pv-lb__panel { opacity: 1; transform: none; }
    .pv-lb .pv-media { border-radius: 20px 20px 0 0; }
    .pv-lb__body { display: grid; gap: 14px; padding: 18px 20px 22px; }
    @media (min-width: 760px) { .pv-lb__body { grid-template-columns: 1fr auto; align-items: end; } }
    .pv-lb__title { margin: 4px 0 6px; font: 700 clamp(28px, 5vw, 40px)/1.05 var(--pv-serif); }
    .pv-lb__desc { margin: 0; color: var(--pv-dim); font-size: 15px; }
    .pv-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .pv-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px;
      border-radius: 999px; border: 1px solid rgba(255, 221, 167, .45); background: rgba(24, 10, 6, .6);
      color: var(--pv-paper); font: 800 14px/1 var(--pv-sans); text-decoration: none; cursor: pointer;
    }
    .pv-btn--main { background: linear-gradient(90deg, #f3b765, var(--pv-rose)); color: var(--pv-ink); border-color: transparent; }
    .pv-btn .pv-arrow { transition: transform 260ms var(--pv-spring); }
    .pv-btn:hover .pv-arrow { transform: translateX(4px); }
    .pv-icon { position: absolute; z-index: 3; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .6); color: #fff; font-size: 18px; cursor: pointer; }
    .pv-icon--close { right: 12px; top: 12px; }
    .pv-icon--prev { left: 10px; top: 26%; } .pv-icon--next { right: 10px; top: 26%; }
    .pv-dots { display: flex; justify-content: center; gap: 6px; padding: 0 0 16px; }
    .pv-dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255, 238, 210, .25); transition: width 300ms var(--pv-spring), background 200ms; }
    .pv-dots i.on { width: 18px; background: var(--pv-gold); }

    @media (max-width: 520px) {
      .pv-actions .pv-btn { flex: 1 1 auto; }
      .pv-icon--prev, .pv-icon--next { display: none; } /* swipe instead */
    }
    @media (prefers-reduced-motion: reduce) {
      .pv-shell *, .pv-lb * { animation-duration: 1ms !important; transition-duration: 1ms !important; }
    }
  </style>
</head>

  <script>
  (() => {
    /* ================= Template data — swap in real works later =================
       video:  short loop, 3–8s, muted, 16:9, ~960×540 H.264 (≈0.5–1.5 MB)
       poster: first frame (.webp) shown before the clip loads
       full:   link to the full-length video (YouTube / Bilibili / mp4)
       doc:    PDF or project page                                                  */
    const WORKS = [
      { cat: 'shader', ph: ['rgba(255,170,110,.6)', 'rgba(255,120,130,.45)', 'linear-gradient(135deg,#3d1611,#160608)'],
        title: { zh: '作品标题 A', en: 'Work Title A' }, kicker: { zh: 'SHADER · 个人', en: 'SHADER · SOLO' }, tags: ['HLSL', 'URP'],
        meta: { zh: '一句话：解决了什么问题', en: 'One line: the problem it solves' } },
      { cat: 'pcg', ph: ['rgba(170,220,140,.45)', 'rgba(255,200,120,.4)', 'linear-gradient(135deg,#1f2512,#0d0a06)'],
        title: { zh: '作品标题 B', en: 'Work Title B' }, kicker: { zh: 'PCG · 个人', en: 'PCG · SOLO' }, tags: ['Houdini', 'UE5'],
        meta: { zh: '一句话：规则 → 场景', en: 'One line: rules to scene' } },
      { cat: 'tool', ph: ['rgba(140,190,255,.45)', 'rgba(255,220,160,.35)', 'linear-gradient(135deg,#141b2a,#0a0607)'],
        title: { zh: '作品标题 C', en: 'Work Title C' }, kicker: { zh: '工具 · 公司项目', en: 'TOOL · STUDIO' }, tags: ['Python', 'Unity'],
        meta: { zh: '一句话：效率提升 xx%', en: 'One line: xx% faster' } },
      { cat: 'render', ph: ['rgba(255,140,200,.4)', 'rgba(255,200,140,.4)', 'linear-gradient(135deg,#2a1020,#0d0508)'],
        title: { zh: '作品标题 D', en: 'Work Title D' }, kicker: { zh: '渲染 · 个人', en: 'RENDER · SOLO' }, tags: ['Lighting', 'Post'],
        meta: { zh: '一句话：氛围与情绪', en: 'One line: mood & atmosphere' } },
      { cat: 'shader', ph: ['rgba(255,215,140,.55)', 'rgba(200,120,255,.35)', 'linear-gradient(135deg,#2c1a0c,#0c0608)'],
        title: { zh: '作品标题 E', en: 'Work Title E' }, kicker: { zh: 'SHADER · 研究', en: 'SHADER · STUDY' }, tags: ['Character'],
        meta: { zh: '一句话：材质研究', en: 'One line: material study' } },
      { cat: 'tool', ph: ['rgba(255,190,120,.5)', 'rgba(130,220,210,.35)', 'linear-gradient(135deg,#1b1a12,#0b0606)'],
        title: { zh: '作品标题 F', en: 'Work Title F' }, kicker: { zh: '工具 · 公司项目', en: 'TOOL · STUDIO' }, tags: ['UE4', 'Blueprint'],
        meta: { zh: '一句话：给谁用、省了什么', en: 'One line: who uses it, what it saves' } },
      { cat: 'render', ph: ['rgba(255,240,210,.4)', 'rgba(255,130,100,.4)', 'linear-gradient(135deg,#251410,#090404)'],
        title: { zh: '作品标题 G', en: 'Work Title G' }, kicker: { zh: '渲染 · 重制', en: 'RENDER · REMASTER' }, tags: ['Remaster'],
        meta: { zh: '一句话：前后对比', en: 'One line: before / after' } },
      { cat: 'code', ph: ['rgba(120,200,255,.4)', 'rgba(255,180,120,.45)', 'linear-gradient(135deg,#12202a,#0a0606)'],
        title: { zh: '作品标题 H', en: 'Work Title H' }, kicker: { zh: '代码 · 团队', en: 'CODE · TEAM' }, tags: ['C#', 'Gameplay'],
        meta: { zh: '一句话：你负责的部分', en: 'One line: your part' } },
    ];
    const CATS = [
      { id: 'all', zh: '全部', en: 'All' }, { id: 'shader', zh: 'Shader', en: 'Shader' }, { id: 'pcg', zh: 'PCG', en: 'PCG' },
      { id: 'tool', zh: '工具', en: 'Tools' }, { id: 'render', zh: '渲染', en: 'Render' },
    ];
    const S = {
      zh: { eyebrow: 'Technical Artist', title: '作品集', copy: 'Shader / 工具 / 动画 / PCG — 每个作品都是一段可以直接看的短视频。',
        statWorks: '个作品', statClip: '循环预览', reelBadge: '作品集混剪', reelHint: '点击放大', works: '作品', preview: '预览',
        full: '完整视频', doc: '项目文档', ph: '短视频 · 16:9 · 3–8s 循环', clip: '预览' },
      en: { eyebrow: 'Technical Artist', title: 'Works', copy: 'Shaders / Tools / Animation / PCG — every piece plays as a short clip.',
        statWorks: 'works', statClip: 'looping previews', reelBadge: 'Showreel', reelHint: 'Tap to enlarge', works: 'Works', preview: 'Preview',
        full: 'Full video', doc: 'Project doc', ph: 'SHORT CLIP · 16:9 · 3–8s LOOP', clip: 'Preview' },
    };
    const lang = () => (document.documentElement.lang || '').startsWith('en') ? 'en' : 'zh';
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ================= Feedback: press squash, ring + sparks, haptic ================= */
    const FX = '.pv-fx, .pv-card, .pv-fbtn, .nav-links a, .nav-logo, #langToggle, #navToggle, .footer-links a';
    const ring = (x, y, sz) => { if (reduced) return; const r = document.createElement('span'); r.className = 'pv-ring'; r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.setProperty('--sz', sz); document.body.appendChild(r); setTimeout(() => r.remove(), 600); };
    const sparks = (x, y, n) => {
      if (reduced) return;
      for (let i = 0; i < n; i++) {
        const s = document.createElement('span'), a = (i / n) * Math.PI * 2 + Math.random() * .5, d = 24 + Math.random() * 26;
        s.className = 'pv-spark'; s.style.left = x + 'px'; s.style.top = y + 'px';
        s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
        document.body.appendChild(s); setTimeout(() => s.remove(), 600);
      }
    };
    document.addEventListener('pointerdown', (e) => {
      const el = e.target.closest(FX); if (!el) return;
      el.classList.add('pv-fx', 'is-pressed');
      const up = () => { el.classList.remove('is-pressed'); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); };
      addEventListener('pointerup', up); addEventListener('pointercancel', up);
    });
    document.addEventListener('click', (e) => {
      const el = e.target.closest(FX); if (!el) return;
      const r = el.getBoundingClientRect();
      const x = e.clientX || r.left + r.width / 2, y = e.clientY || r.top + r.height / 2;
      const big = el.classList.contains('pv-card') || el.classList.contains('pv-reel');
      ring(x, y, big ? 9 : 6); sparks(x, y, big ? 10 : 6);
      try { navigator.vibrate && navigator.vibrate(8); } catch (err) {}
    });

    /* ================= Cards ================= */
    const grid = $('#pvGrid');
    const phHTML = (w) => `<div class="pv-ph" style="--ph-a:${w.ph[0]};--ph-b:${w.ph[1]};--ph-bg:${w.ph[2]}"></div>`;
    const cards = WORKS.map((w, i) => {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'pv-card pv-rise'; el.dataset.cat = w.cat; el.dataset.i = i;
      el.style.setProperty('--d', (i % 3) * 70 + 'ms');
      el.innerHTML = `
        <div class="pv-media" data-video>
          ${w.video ? `<video src="${w.video}" poster="${w.poster || ''}" muted loop playsinline preload="none"></video>` : phHTML(w)}
          <span class="pv-badge"></span><span class="pv-bar"><i></i></span>
        </div>
        <div class="pv-card__body">
          <div class="pv-kicker"></div><h3 class="pv-card__title"></h3><div class="pv-card__meta"></div>
          <div class="pv-tags">${w.tags.map((t) => `<span class="pv-tag">${t}</span>`).join('')}</div>
        </div>`;
      el.addEventListener('pointermove', (e) => { const r = el.getBoundingClientRect(); el.style.setProperty('--mx', e.clientX - r.left + 'px'); el.style.setProperty('--my', e.clientY - r.top + 'px'); });
      el.addEventListener('click', () => openLb(i, el));
      grid.appendChild(el);
      return el;
    });

    /* ================= Filters ================= */
    let cat = 'all';
    const filters = $('#pvFilters');
    const renderFilters = () => {
      $$('.pv-fbtn', filters).forEach((b) => { const on = b.dataset.cat === cat; b.classList.toggle('is-on', on); b.setAttribute('aria-selected', on); });
    };
    filters.addEventListener('click', (e) => {
      const b = e.target.closest('.pv-fbtn'); if (!b || b.dataset.cat === cat) return;
      cat = b.dataset.cat; renderFilters();
      const show = (el) => cat === 'all' || el.dataset.cat === cat;
      cards.forEach((el) => { if (!el.classList.contains('is-hidden')) el.classList.add('is-out'); });
      setTimeout(() => {
        let k = 0;
        cards.forEach((el) => {
          el.classList.toggle('is-hidden', !show(el));
          if (show(el)) { const d = k++ * 60; el.classList.add('is-out'); requestAnimationFrame(() => setTimeout(() => el.classList.remove('is-out'), d)); }
        });
      }, 200);
    });

    /* ================= Clips play only while on screen ================= */
    const io = new IntersectionObserver((entries) => entries.forEach((en) => {
      const m = en.target, v = $('video', m), on = en.isIntersecting && en.intersectionRatio > .45;
      m._on = on; m.classList.toggle('is-paused', !on);
      if (v) { if (on) { v.preload = 'auto'; v.play().catch(() => {}); } else v.pause(); }
    }), { threshold: [0, .45, .8] });
    $$('[data-video]').forEach((m) => io.observe(m));
    const t0 = performance.now();
    const bars = () => {
      $$('[data-video]').forEach((m, k) => {
        if (!m._on) return;
        const v = $('video', m), bar = $('.pv-bar i', m);
        const p = v && v.duration ? v.currentTime / v.duration : (((performance.now() - t0) / 1000 + k * .7) % 6) / 6;
        bar.style.width = (p * 100).toFixed(1) + '%';
      });
      requestAnimationFrame(bars);
    };
    requestAnimationFrame(bars);

    /* ================= Lightbox (tap, ← →, swipe) ================= */
    const lb = $('#pvLb'), panel = $('#pvPanel');
    let cur = -1;
    const visible = () => cards.filter((c) => !c.classList.contains('is-hidden')).map((c) => +c.dataset.i);
    const fill = (i) => {
      const w = WORKS[i], L = lang(); cur = i;
      $('#pvLbKicker').textContent = w.kicker[L];
      $('#pvLbTitle').textContent = w.title[L];
      $('#pvLbDesc').textContent = w.meta[L];
      $('#pvLbTags').innerHTML = w.tags.map((t) => `<span class="pv-tag">${t}</span>`).join('');
      $('#pvFull').href = w.full || '#'; $('#pvDoc').href = w.doc || '#';
      const m = $('#pvLbMedia'), old = $('.pv-ph, video', m); old && old.remove();
      m.insertAdjacentHTML('afterbegin', w.video ? `<video src="${w.video}" poster="${w.poster || ''}" muted loop playsinline autoplay></video>` : phHTML(w));
      const ph = $('.pv-ph', m); ph && ph.setAttribute('data-label', S[L].ph);
      m._on = true; m.classList.remove('is-paused');
      const vis = visible();
      $('#pvDots').innerHTML = vis.map((k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
    };
    const openLb = (i, from) => {
      if (from) { const r = from.getBoundingClientRect(); panel.style.setProperty('--ox', ((r.left + r.width / 2) / innerWidth * 100).toFixed(0) + '%'); }
      fill(i); lb.classList.add('is-open'); lb.setAttribute('aria-hidden', 'false'); document.body.classList.add('pv-locked');
    };
    const closeLb = () => { lb.classList.remove('is-open'); lb.setAttribute('aria-hidden', 'true'); document.body.classList.remove('pv-locked'); cur = -1; };
    const step = (d) => {
      const vis = visible(), k = vis.indexOf(cur); fill(vis[(k + d + vis.length) % vis.length]);
      panel.animate([{ transform: `translateX(${d * 28}px)`, opacity: .35 }, { transform: 'none', opacity: 1 }], { duration: 340, easing: 'cubic-bezier(.2,1.4,.35,1)' });
    };
    lb.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeLb(); });
    $('#pvPrev').addEventListener('click', () => step(-1));
    $('#pvNext').addEventListener('click', () => step(1));
    addEventListener('keydown', (e) => { if (cur < 0) return; if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
    let sx = null;
    panel.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
    panel.addEventListener('touchend', (e) => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); sx = null; });
    $('#pvReel').addEventListener('click', () => openLb(0, $('#pvReel')));

    /* ================= Text — follows the site's language toggle ================= */
    const applyText = () => {
      const L = lang(), T = S[L];
      $$('[data-pv]').forEach((el) => { if (T[el.dataset.pv] != null) el.textContent = T[el.dataset.pv]; });
      cards.forEach((el, i) => {
        const w = WORKS[i];
        $('.pv-kicker', el).textContent = w.kicker[L];
        $('.pv-card__title', el).textContent = w.title[L];
        $('.pv-card__meta', el).textContent = w.meta[L];
        $('.pv-badge', el).textContent = T.clip + ' · 0:0' + (4 + (i % 4));
        const ph = $('.pv-ph', el); ph && ph.setAttribute('data-label', T.ph);
      });
      renderFilters();
      if (cur >= 0) fill(cur);
    };
    new MutationObserver(applyText).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
    applyText();

    /* ================= Entrance ================= */
    const rev = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('is-in'); rev.unobserve(e.target); } }), { threshold: .1 });
    $$('.pv-rise').forEach((el) => rev.observe(el));
  })();
  </script>
</body>
</html>
